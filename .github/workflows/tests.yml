name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: SWI-Prolog (PPA officiel ; les paquets Ubuntu sont trop anciens pour Janus)
        run: |
          sudo add-apt-repository -y ppa:swi-prolog/stable
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y swi-prolog-nox
          swipl --version
      - name: Dépendances
        run: pip install janus-swi pytest numpy -e .
      - name: Tests sans données (ceux qui demandent Iconclass ou WordNet sont sautés)
        run: python -m pytest -q
