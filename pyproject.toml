[project]
name = "oedipamaas"
version = "0.2.0"
description = "Moteur iconographique : descriptions d'images en mots vers codes Iconclass prouvés"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Le moteur complet (règles) demande SWI-Prolog et son pont Janus ; la base et les vecteurs n'en ont pas besoin.
prolog = ["janus-swi>=1.5"]
semantique = ["numpy>=1.26", "sentence-transformers>=3"]
test = ["pytest>=8"]

[project.scripts]
oedipamaas = "oedipamaas.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oedipamaas*"]

[tool.setuptools.package-data]
oedipamaas = ["regles/*.pl"]
